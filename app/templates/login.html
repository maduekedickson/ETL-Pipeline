{% extends "base.html" %}

{% block title %}Log In - RiteClick Data Platform{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="brand-badge" style="margin: 0 auto 1rem; width: 44px; height: 44px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.35rem;">
        Sign in to access your ETL pipelines & files
      </p>
    </div>

    <form method="POST" action="{{ url_for('main.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label" for="identifier">Email or Username</label>
        <input 
          type="text" 
          id="identifier" 
          name="identifier" 
          class="form-control" 
          value="{{ identifier or '' }}"
          placeholder="user@company.com or username" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.85rem;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('main.signup') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">
        Create Account
      </a>
    </div>
  </div>

  <div style="text-align: center; font-size: 0.82rem; color: var(--text-dim);">
    Protected by session-based authentication & DynamoDB backend.
  </div>
</div>
{% endblock %}
