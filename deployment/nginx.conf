# Nginx Configuration for RiteClick ETL Web Application
# Place in /etc/nginx/conf.d/riteclick.conf or /etc/nginx/sites-available/riteclick

server {
    listen 80;
    server_name _;
    # Redirect all plain HTTP traffic to secure HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL Certificate Configuration
    # Replace with Let's Encrypt certificates or your domain certificate
    ssl_certificate /etc/ssl/certs/riteclick.crt;
    ssl_certificate_key /etc/ssl/private/riteclick.key;

    # SSL Hardening & Modern Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow up to 100MB CSV File Uploads
    client_max_body_size 100M;
    client_body_timeout 120s;

    # Static Assets Caching
    location /static/ {
        alias /opt/riteclick/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Flask via Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # Timeouts for large uploads / long running operations
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
